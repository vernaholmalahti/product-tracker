# Continuous integration: GitHub runs this on every push and pull request.
# A green ✓ on the repo means: both projects typecheck and all tests pass on a fresh machine.
name: CI

on:
  push:
  pull_request:

jobs:
  server:
    name: Server – typecheck + tests
    runs-on: ubuntu-latest

    # A throwaway PostgreSQL just for this run (same version as docker-compose.yml).
    services:
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ripe
          POSTGRES_PASSWORD: ripe
          POSTGRES_DB: ripe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ripe -d ripe"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    # Test-only values. No real secrets: the AI key is left out, so AI stays switched off.
    env:
      DATABASE_URL: postgresql://ripe:ripe@localhost:5432/ripe
      ADMIN_TOKEN: ci-test-token

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci # exact versions from package-lock.json; also runs `prisma generate`
      - run: npx prisma migrate deploy # create the tables
      - run: npx prisma db seed # Solein, NMN, markets – the API tests expect them
      - run: npm run typecheck
      - run: npm test

  mobile:
    name: Mobile app – typecheck
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
